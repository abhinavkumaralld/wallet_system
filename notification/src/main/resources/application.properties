spring.application.name=notification
server.port=8083

# Database
spring.datasource.url=jdbc:mysql://mysql:3306/auth_db
#spring.datasource.username=root
#spring.datasource.password=Mypswrdsql@76
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Kafka Consumer
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.abhi.notification.dto.TransferEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

#EMAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=abhinavkr2272@gmail.com
spring.mail.password=cszbhgqptaeennfe
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

# Trace 100% of requests
management.tracing.sampling.probability=1.0


# Zipkin endpoint
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

logging.pattern.level=%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]

spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true